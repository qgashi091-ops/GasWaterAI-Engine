<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GasWaterAI v0.4 -- Annotation Tool</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; margin: 0; padding: 0;
         display: flex; flex-direction: column; height: 100vh; }
  header { padding: 10px 16px; border-bottom: 1px solid #8884; display: flex; align-items: center; gap: 16px; }
  header h1 { font-size: 16px; margin: 0; }
  #progress { font-variant-numeric: tabular-nums; }
  #progress-bar-outer { flex: 1; max-width: 300px; height: 8px; background: #8882; border-radius: 4px; overflow: hidden; }
  #progress-bar-inner { height: 100%; background: #4a90d9; width: 0%; transition: width 0.2s; }
  main { flex: 1; display: flex; overflow: hidden; }
  #crop-pane { flex: 1.3; display: flex; flex-direction: column; align-items: center; justify-content: center;
               padding: 16px; overflow: auto; border-right: 1px solid #8884; }
  #crop-img { max-width: 100%; max-height: 55vh; border: 1px solid #8886; background: #fff; image-rendering: pixelated; }
  #wide-toggle { margin-top: 10px; cursor: pointer; }
  #info-pane { flex: 1; padding: 16px; overflow-y: auto; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 11px; text-transform: uppercase; opacity: 0.6; margin-bottom: 4px; }
  .suggestion { display: inline-block; padding: 4px 10px; margin: 2px 4px 2px 0; border-radius: 12px;
                background: #4a90d922; border: 1px solid #4a90d966; font-size: 13px; cursor: pointer; }
  .nearby-text span { display: inline-block; background: #8882; border-radius: 6px; padding: 2px 8px; margin: 2px; font-size: 12px; }
  #class-buttons { display: flex; flex-wrap: wrap; gap: 6px; }
  .class-btn { padding: 8px 12px; border-radius: 6px; border: 1px solid #8886; background: none; cursor: pointer; font-size: 13px; }
  .class-btn:hover { background: #4a90d922; }
  .class-btn.special { border-color: #d9784a; }
  footer { padding: 10px 16px; border-top: 1px solid #8884; display: flex; gap: 10px; align-items: center; }
  button.nav { padding: 8px 16px; border-radius: 6px; border: 1px solid #8886; background: none; cursor: pointer; }
  #status-msg { font-size: 12px; opacity: 0.7; }
  code { background: #8882; padding: 1px 5px; border-radius: 4px; }
</style>
</head>
<body>
<header>
  <h1>v0.4 Annotation</h1>
  <div id="progress-bar-outer"><div id="progress-bar-inner"></div></div>
  <div id="progress">-- / --</div>
</header>
<main>
  <div id="crop-pane">
    <div id="crop-wrap" style="position:relative; display:inline-block;">
      <img id="crop-img" src="" alt="candidate crop">
      <div id="bbox-overlay" style="position:absolute; border:3px solid #e0393e; box-shadow:0 0 0 1px #fff; pointer-events:none; display:none;"></div>
    </div>
    <div id="wide-toggle"><a href="#" id="wide-link">Show larger context</a></div>
  </div>
  <div id="info-pane">
    <div class="field"><label>Plan / page</label><div id="plan-page">--</div></div>
    <div class="field"><label>Engine suggestions</label><div id="suggestions"></div></div>
    <div class="field"><label>Nearby text</label><div class="nearby-text" id="nearby-text"></div></div>
    <div class="field"><label>Graph relation</label><div id="graph-rel">--</div></div>
    <div class="field"><label>Choose class</label><div id="class-buttons"></div></div>
    <div class="field"><label>Note (optional)</label><input type="text" id="note-input" style="width:100%"></div>
  </div>
</main>
<footer>
  <button class="nav" id="prev-btn">&larr; Previous</button>
  <button class="nav" id="skip-btn">Skip</button>
  <button class="nav" id="next-btn">Next &rarr;</button>
  <span id="status-msg"></span>
</footer>
<script>
let ids = [];
let cursor = 0;
let classes = {};
let currentRecord = null;

async function j(url, opts) {
  const r = await fetch(url, opts);
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

async function loadClasses() {
  classes = await j('/api/classes');
  const container = document.getElementById('class-buttons');
  container.innerHTML = '';
  for (const name of Object.keys(classes)) {
    const btn = document.createElement('button');
    btn.className = 'class-btn' + (['NOT_A_COMPONENT', 'AMBIGUOUS', 'OTHER_RELEVANT_SYMBOL'].includes(name) ? ' special' : '');
    btn.textContent = name;
    btn.onclick = () => annotate(name);
    container.appendChild(btn);
  }
}

async function loadIds() {
  ids = await j('/api/candidates');
}

async function refreshProgress() {
  const p = await j('/api/progress');
  document.getElementById('progress').textContent = `${p.annotated} / ${p.total}`;
  document.getElementById('progress-bar-inner').style.width = (100 * p.annotated / Math.max(p.total, 1)) + '%';
}

function fmtSuggestion(s, kind) {
  if (!s) return '';
  const pct = s.score != null ? ` (${(s.score * 100).toFixed(0)}%)` : '';
  return `<span class="suggestion" data-label="${s.label}">${kind}: ${s.label}${pct}</span>`;
}

function drawBboxOverlay() {
  const img = document.getElementById('crop-img');
  const overlay = document.getElementById('bbox-overlay');
  if (!currentRecord || !currentRecord.bbox_in_crop_px || !img.naturalWidth || showingWideCrop) {
    overlay.style.display = 'none';
    return;
  }
  const scaleX = img.clientWidth / img.naturalWidth;
  const scaleY = img.clientHeight / img.naturalHeight;
  const [x0, y0, x1, y1] = currentRecord.bbox_in_crop_px;
  overlay.style.left = (x0 * scaleX) + 'px';
  overlay.style.top = (y0 * scaleY) + 'px';
  overlay.style.width = ((x1 - x0) * scaleX) + 'px';
  overlay.style.height = ((y1 - y0) * scaleY) + 'px';
  overlay.style.display = 'block';
}

let showingWideCrop = false;

async function showCandidate(idx) {
  if (idx < 0 || idx >= ids.length) return;
  cursor = idx;
  const id = ids[cursor];
  currentRecord = await j(`/api/candidate/${id}`);
  showingWideCrop = false;
  const img = document.getElementById('crop-img');
  img.onload = drawBboxOverlay;
  img.src = `/api/candidate/${id}/crop?t=${Date.now()}`;
  document.getElementById('wide-link').textContent = 'Show larger context';
  document.getElementById('plan-page').textContent = `${currentRecord.plan_id_pseudonymous} / page ${currentRecord.page} -- status: ${currentRecord.verification_status}`;
  const sug = currentRecord.engine_suggestions || {};
  document.getElementById('suggestions').innerHTML =
    (fmtSuggestion(sug.plan_specific, 'plan-specific') || '') + ' ' + (fmtSuggestion(sug.generic, 'generic') || '')
    || '<em>no engine suggestion</em>';
  document.querySelectorAll('.suggestion').forEach(el => {
    el.onclick = () => annotate(el.dataset.label);
  });
  const nt = document.getElementById('nearby-text');
  nt.innerHTML = (currentRecord.nearby_text || []).map(t => `<span>${t}</span>`).join('') || '<em>none</em>';
  const ga = currentRecord.graph_association || {};
  document.getElementById('graph-rel').textContent = `${ga.relation || '--'}` +
    (ga.node_ids && ga.node_ids.length ? ` (nodes: ${ga.node_ids.join(', ')})` : '') +
    (ga.edge_ids && ga.edge_ids.length ? ` (edges: ${ga.edge_ids.join(', ')})` : '');
  document.getElementById('note-input').value = currentRecord.annotator_note || '';
}

async function annotate(assignedClass) {
  const id = ids[cursor];
  const note = document.getElementById('note-input').value || null;
  await j(`/api/candidate/${id}/annotate`, {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({assigned_class: assignedClass, status: 'LABELED', annotator_note: note}),
  });
  document.getElementById('status-msg').textContent = `Saved: ${assignedClass}`;
  await refreshProgress();
  showCandidate(cursor + 1 < ids.length ? cursor + 1 : cursor);
}

async function skip() {
  const id = ids[cursor];
  await j(`/api/candidate/${id}/annotate`, {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({status: 'SKIPPED'}),
  });
  await refreshProgress();
  showCandidate(cursor + 1 < ids.length ? cursor + 1 : cursor);
}

document.getElementById('prev-btn').onclick = () => showCandidate(cursor - 1);
document.getElementById('next-btn').onclick = () => showCandidate(cursor + 1);
document.getElementById('skip-btn').onclick = skip;
document.getElementById('wide-link').onclick = async (e) => {
  e.preventDefault();
  const id = ids[cursor];
  const r = await fetch(`/api/candidate/${id}/wide_crop?t=${Date.now()}`);
  if (r.status === 403) {
    document.getElementById('status-msg').textContent =
      'Larger context view withheld: it would overlap text that looks like title-block/customer information.';
    return; // tight crop (with its own overlay) stays showing -- nothing to reset
  }
  if (!r.ok) {
    document.getElementById('status-msg').textContent = 'Could not load the larger context view.';
    return;
  }
  const blobUrl = URL.createObjectURL(await r.blob());
  showingWideCrop = true;
  document.getElementById('bbox-overlay').style.display = 'none';
  document.getElementById('crop-img').src = blobUrl;
  document.getElementById('wide-link').textContent = 'Show tight crop';
  document.getElementById('wide-link').onclick = (e2) => {
    e2.preventDefault();
    showCandidate(cursor); // resets the image, overlay, and toggle back to the default tight crop
  };
};

window.addEventListener('resize', drawBboxOverlay);

document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowLeft') showCandidate(cursor - 1);
  if (e.key === 'ArrowRight') showCandidate(cursor + 1);
  if (e.key === 's' || e.key === 'S') skip();
});

(async () => {
  await loadClasses();
  await loadIds();
  await refreshProgress();
  if (ids.length) await showCandidate(0);
})();
</script>
</body>
</html>
